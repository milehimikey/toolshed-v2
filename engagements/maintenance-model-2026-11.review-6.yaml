  - decision: "maintenance-model-2026-11/maintenance-tracking/maintenance-edit-shape"
    # class event · costly to undo · confidence medium · consumed by 0 node(s)
    # Q: How does the model carry Schedule Tool Maintenance editing the task list of a tool that is already in maintenance, including removing or rewording a task?
    # * replace-alternative-event: Schedule Tool Maintenance carries the whole task list and notes. On a tool not in maintenance it records Tool Maintenance Scheduled. On a tool already in maintenance it records the alternative outcome Tool Maintenance Tasks Changed { toolId, tasks, notes, changedBy assigned, changedAt assigned }, which replaces the list and notes. If the list and notes are the same as now, it records nothing
    #   re-record-scheduled: Record Tool Maintenance Scheduled again with the new list
    #   per-task-events: Separate per-task events (Task Added, Task Removed, Task Reworded), with tasks keyed by an id
    # basis: ruling maintenance-model-2026-11/maintenance-tracking/add-tasks-command: scheduling a tool already in maintenance edits its scheduled tasks, including removing or rewording; constitution.md:183-187 (Amendment 7: a command that changes something is safe to repeat; state-setting commands carry no 'from' value); em-dsl.md validate rule 1: alternative outcomes of one command are one slice, written with `oneof { event A … event B … }`; keep-tools-in-working-order/keep-tools-in-working-order.em:11-18
    ruling: confirm

